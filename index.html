<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>o s c u l u n a r</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #ffffff;
            --color-text: #1a1a1a;
            --spacing-sm: 1rem;
            --spacing-md: 2rem;
            --spacing-lg: 4rem;
            --font-body: 'Manrope', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            padding: var(--spacing-md);
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: var(--color-text);
        }

        /* Gallery Section */
        .gallery-section {
            padding: var(--spacing-lg) var(--spacing-md);
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Grid de 3 colunas */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.02);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="logo">GALLERY</div>
    </nav>

    <!-- Gallery Section -->
    <section class="gallery-section">
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=600&fit=crop" alt="Photo 1">
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600&h=600&fit=crop" alt="Photo 2">
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&h=600&fit=crop" alt="Photo 3">
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&h=600&fit=crop" alt="Photo 4">
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=600&h=600&fit=crop" alt="Photo 5">
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1465146633011-14f8e0781093?w=600&h=600&fit=crop" alt="Photo 6">
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?w=600&h=600&fit=crop" alt="Photo 7">
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=600&h=600&fit=crop" alt="Photo 8">
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600&h=600&fit=crop" alt="Photo 9">
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?w=600&h=600&fit=crop" alt="Photo 10">
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1418065460487-3e41a6c84dc5?w=600&h=600&fit=crop" alt="Photo 11">
            </div>
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&h=600&fit=crop" alt="Photo 12">
            </div>
        </div>
    </section>
</body>
</html>
