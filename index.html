<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>m s</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --white: #FFFFFF;
            --black: #0A0A0A;
            --gray: #E5E5E5;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: var(--white);
            color: var(--black);
            overflow-x: hidden;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 60px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: var(--black);
            text-transform: lowercase;
        }

        /* Gallery */
        .gallery {
            margin-top: 140px;
            padding: 0;
            height: calc(100vh - 140px);
            overflow: hidden;
        }

        .photo-grid {
            display: flex;
            gap: 20px;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 40px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--black) transparent;
        }

        .photo-grid::-webkit-scrollbar {
            height: 8px;
        }

        .photo-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .photo-grid::-webkit-scrollbar-thumb {
            background: var(--black);
            border-radius: 4px;
        }

        .photo-item {
            position: relative;
            overflow: hidden;
            background: var(--gray);
            height: 100%;
            flex-shrink: 0;
            width: auto;
            /* aspect-ratio: 4/5; */
            cursor: pointer;
        }

        .photo-item img {
            width: auto;
            height: 100%;
            object-fit: contain;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            display: block;
        }

        .photo-item:hover img {
            transform: scale(1.03);
        }

        /* Loading animation */
        .photo-item {
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Stagger animation delays */
        .photo-item:nth-child(n) {
            animation-delay: calc(var(--index) * 0.02s);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .photo-grid {
                gap: 15px;
                padding: 30px;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 30px 30px;
            }

            .gallery {
                margin-top: 100px;
                height: calc(100vh - 100px);
            }

            .photo-grid {
                gap: 15px;
                padding: 20px;
            }

            .logo {
                font-size: 16px;
            }
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Image lightbox placeholder */
        .photo-item img {
            cursor: zoom-in;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 80px 40px 40px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            cursor: zoom-out;
        }

        .lightbox-close {
            position: fixed;
            top: 30px;
            right: 40px;
            width: 40px;
            height: 40px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 2001;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            color: var(--black);
            transition: opacity 0.3s ease;
        }

        .lightbox-close:hover {
            opacity: 0.6;
        }

        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: none;
            border: 1px solid var(--black);
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            color: var(--black);
            transition: all 0.3s ease;
            z-index: 2001;
        }

        .lightbox-nav:hover {
            background: var(--black);
            color: var(--white);
        }

        .lightbox-prev {
            left: 40px;
        }

        .lightbox-next {
            right: 40px;
        }

        .lightbox-counter {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            letter-spacing: 0.2em;
            color: var(--black);
            z-index: 2001;
        }

        @media (max-width: 768px) {
            .lightbox {
                padding: 60px 20px 20px;
            }

            .lightbox-close {
                top: 20px;
                right: 20px;
            }

            .lightbox-nav {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .lightbox-prev {
                left: 20px;
            }

            .lightbox-next {
                right: 20px;
            }

            .lightbox-counter {
                top: 25px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">m s</div>
    </header>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        <div class="lightbox-counter" id="lightboxCounter"></div>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev">←</button>
        <div class="lightbox-content">
            <img id="lightboxImg" src="" alt="Photography">
        </div>
        <button class="lightbox-nav lightbox-next" id="lightboxNext">→</button>
    </div>

    <!-- Gallery -->
    <section class="gallery">
        <div class="photo-grid">
            
            <div class="photo-item" style="--index: 1;"><img src= "https://i.ibb.co/mC3qqhGp/25.jpg"alt=></div>
            <div class="photo-item" style="--index: 1;"><img src="https://i.ibb.co/xRtcJ5D/19.jpg" alt=></div>
            <div class="photo-item" style="--index: 1;"><img src="https://i.ibb.co/8D4PPMmp/17.jpg" alt=></div>
            <div class="photo-item" style="--index: 1;"><img src="https://i.ibb.co/LhpKB8bT/15.jpg" alt=></div>
            <div class="photo-item" style="--index: 1;"><img src="https://i.ibb.co/84tLCXKB/13.jpg" alt=></div>
            <div class="photo-item" style="--index: 1;"><img src="https://i.ibb.co/21X6LhYr/12.jpg" alt=></div>
            <div class="photo-item" style="--index: 1;"><img src="https://i.ibb.co/0RMGr6Jx/1.jpg" alt=></div>
            <div class="photo-item" style="--index: 1;"><img src="https://i.ibb.co/n8BrsXQC/6.jpg" alt=></div>
            <div class="photo-item" style="--index: 1;"><img src="https://i.ibb.co/39VTHZB8/3.jpg" alt=></div>
            <div class="photo-item" style="--index: 1;"><img src="https://i.ibb.co/27BKx9PG/2.jpg" alt=></div>
            <div class="photo-item" style="--index: 1;"><img src="https://i.ibb.co/h1TLNBqf/DSC9642.jpg" alt=></div>
            
            
        </div>
    </section>

    <script>
        // Lightbox functionality
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxClose = document.getElementById('lightboxClose');
        const lightboxPrev = document.getElementById('lightboxPrev');
        const lightboxNext = document.getElementById('lightboxNext');
        const lightboxCounter = document.getElementById('lightboxCounter');
        const photoItems = document.querySelectorAll('.photo-item img');
        
        let currentIndex = 0;
        const totalPhotos = photoItems.length;

        // Open lightbox
        photoItems.forEach((img, index) => {
            img.addEventListener('click', () => {
                currentIndex = index;
                openLightbox();
            });
        });

        function openLightbox() {
            lightboxImg.src = photoItems[currentIndex].src;
            lightboxCounter.textContent = `${currentIndex + 1} / ${totalPhotos}`;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + totalPhotos) % totalPhotos;
            openLightbox();
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % totalPhotos;
            openLightbox();
        }

        // Close button
        lightboxClose.addEventListener('click', closeLightbox);

        // Navigation buttons
        lightboxPrev.addEventListener('click', showPrev);
        lightboxNext.addEventListener('click', showNext);

        // Click outside image to close
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') showPrev();
            if (e.key === 'ArrowRight') showNext();
        });
    </script>
</body>
</html>
